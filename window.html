<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css view from window</title>
    <style>

        #big_background{
            width: 700px;
            height: 500px;
            position: relative;
            background-color: rgb(106, 185, 224);
            overflow: hidden
        }

        #building {
            position: absolute; 
            left: 100px;
            top: 100px;
            height: 1000px;
            width: 500px;
            background: rgb(102, 45, 45);
            border: 1px solid black;
            overflow: hidden;
        }

        #bigwindow {
            width: 200px;
            height: 200px;
            top: 120px;
            color: green;


        }

        .miniwindow {
            width: 40px;
            height: 50px;
            background-color: rgb(100, 92, 92);
            margin: 10px;
            border: 6px dashed rgb(35, 59, 35);
            box-shadow: inset 4px 4px 8px;
            border-radius:100px 100px 0 0;
        }

        #window1 {
            position: absolute;
            top: 200px;
            left: 15px;
        }

        #window2 {
            position: absolute;
            top: 200px;
            left: 70px;

        }
        #window3 {
         position: absolute;
         top: 200px;
         left: 125px;

        }

        #window4 {
         position: absolute;
         top: 200px;
         left: 300px;

        }

        #window5 {
         position: absolute;
         top: 200px;
         left: 355px;

        }

        #window6 {
         position: absolute;
         top: 200px;
         left: 410px;

        }

     .minisquarewindow {
            width: 40px;
            height: 50px;
            background-color: rgb(100, 92, 92);
            margin: 10px;
            border: 6px dashed rgb(35, 59, 35);
            box-shadow: inset 4px 4px 8px;
           
        }

        

       



    </style>
</head>
<body>

<div id="big_background">

    <div id="building">

    <div id="bigwindow"></div>

    <div id="window1" class="miniwindow"></div>
    <div id="window2" class="miniwindow"></div>
    <div id="window3" class="miniwindow"></div>
    <div id="window4" class="miniwindow"></div>
    <div id="window5" class="miniwindow"></div>
    <div id="window6" class="miniwindow"></div>
   
<div id="minisquarewindow">

</div>



</body>
</html>
